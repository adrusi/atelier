# Compositor config for atelier dev instances (see DEVELOPING.md).
# Kept minimal: tests should see sway's default behaviour, not the
# developer's personal config.

output * resolution 1920x1080 scale 1
default_border none
default_floating_border none
focus_follows_mouse no

# Headless outputs start without a background; give screenshots a neutral one.
output * bg #808080 solid_color

# Abstract unix sockets live in the network namespace, which dev instances
# share with the host, so Xwayland would collide with the host's X socket.
xwayland disable
