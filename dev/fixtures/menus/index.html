<!doctype html>
<!-- Things that only appear on interaction, the way sites build them: a
     menu rendered into a portal at the end of <body> when its button is
     clicked (and closed with Escape), a hover card shown on mouseenter,
     and a popover shown with showPopover(). For the interact tool. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>menus fixture</title>
    <style>
      [role="menu"] { position: absolute; top: 60px; left: 10px; padding: 8px; border: 1px solid; background: white; }
      #card { position: absolute; top: 120px; left: 200px; padding: 8px; border: 1px solid; }
      #pop { padding: 8px; }
    </style>
  </head>
  <body>
    <main>
      <button id="open-menu" aria-expanded="false" aria-haspopup="menu">Options</button>
      <a id="user" href="#">a user</a>
      <div id="card" hidden>A hover card</div>
      <button id="open-pop">Info</button>
      <div id="pop" popover>A popover</div>
      <a id="away" href="?away">elsewhere</a>
    </main>
    <script>
      const button = document.getElementById("open-menu");
      let menu = null;
      const close = () => {
        menu?.remove();
        menu = null;
        button.setAttribute("aria-expanded", "false");
      };
      // React-style: the menu opens on pointerdown, not click.
      button.addEventListener("pointerdown", () => {
        if (menu) return close();
        menu = document.createElement("div");
        menu.setAttribute("role", "menu");
        menu.innerHTML = '<div role="menuitem">Rename</div><div role="menuitem">Delete</div>';
        document.body.append(menu);
        button.setAttribute("aria-expanded", "true");
      });
      document.addEventListener("keydown", (e) => e.key === "Escape" && close());
      const user = document.getElementById("user");
      const card = document.getElementById("card");
      user.addEventListener("mouseenter", () => setTimeout(() => (card.hidden = false), 150));
      user.addEventListener("mouseleave", () => (card.hidden = true));
      document.getElementById("open-pop").addEventListener("click", () => document.getElementById("pop").showPopover());
    </script>
  </body>
</html>
