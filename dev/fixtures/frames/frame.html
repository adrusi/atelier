<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>a framed page</title>
  <!-- Responds to the frame's own width, which viewport emulation of the
       page around it must leave real. -->
  <style>@media (max-width: 500px) { #inner { font-weight: 700; background: rgb(230, 240, 255); } }</style>
</head>
<body><p id="inner">Inside a frame</p></body>
</html>
