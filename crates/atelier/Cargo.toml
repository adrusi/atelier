[package]
name = "atelier"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
atelier-proto = { path = "../atelier-proto" }
base64 = "0.22"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
